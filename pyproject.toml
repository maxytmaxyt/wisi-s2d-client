[project]
name = "wisi-s2d-client"
version = "0.3.0"
description = "Reverse-engineered Python client and Web Control Center for the WISI OR S2D DVB-over-IP dongle"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
    "starlette>=0.30.0",
    "uvicorn>=0.20.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
wisi = "wisi.wisi:main"
wisi-ui = "wisi.ui:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "wisi",
    "tools",
    "ui",
]
package-data = {ui = ["static/*"]}
py-modules = [
    "protocol",
    "connection",
    "models",
    "channels",
    "keepalive",
    "prepare",
    "decrypt",
    "stream",
]

[tool.ruff]
line-length = 100
