[project]
name = "wisi-s2d-client"
version = "0.3.0"
description = "Reverse-engineered Python client and Web Control Center for the WISI OR S2D DVB-over-IP dongle"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
    "starlette>=0.30.0",
    "uvicorn>=0.20.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
wisi = "wisi_s2d.cli.main:main"
wisi-ui = "wisi_s2d.cli.ui:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "wisi_s2d",
    "wisi_s2d.protocol",
    "wisi_s2d.core",
    "wisi_s2d.cli",
    "wisi_s2d.web",
    "wisi_s2d.tools",
]
package-data = {wisi_s2d = ["web/static/*"]}

[tool.ruff]
line-length = 100
