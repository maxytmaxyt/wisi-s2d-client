[project]
name = "wisi-s2d-client"
version = "0.2.0"
description = "Reverse-engineered Python client for the WISI OR S2D DVB-over-IP dongle"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
wisi = "wisi.wisi:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "wisi",
    "tools",
]
py-modules = [
    "protocol",
    "models",
    "channels",
    "keepalive",
    "stream",
]

[tool.ruff]
line-length = 100
